name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest build

      - name: Run tests
        run: python -m pytest

      - name: Build and smoke-test distributions
        run: |
          python -m build --sdist --wheel
          wheel_dir="$RUNNER_TEMP/chxsec-wheel"
          python -m pip install --no-deps --target "$wheel_dir" dist/*.whl
          (cd "$RUNNER_TEMP" && PYTHONPATH="$wheel_dir" python -m chxchx_security --help)

      - name: Validate installer syntax
        run: bash -n install-fedora.sh install-remote-fedora.sh install-debian.sh install-remote-debian.sh

      - name: Compile Python sources
        run: python -m compileall -q src

  installer-distro-smoke:
    name: Python/bootstrap tests (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Fedora
            image: fedora:latest
          - distro: Ubuntu 24.04
            image: ubuntu:24.04
          - distro: Kali rolling
            image: kalilinux/kali-rolling
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install runner dependencies
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y git python3 python3-pip python3-pip-wheel tar curl
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 python3-venv python3-pip tar curl
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up project environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e . pytest

      - name: Run test suite
        run: .venv/bin/python -m pytest

      - name: Validate installer syntax
        run: bash -n install-fedora.sh install-remote-fedora.sh install-debian.sh install-remote-debian.sh

  public-scan:
    name: Public tree scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject common secret patterns
        shell: bash
        run: |
          if git grep -nE '(BEGIN .*PRIVATE KEY|password[[:space:]]*=|token[[:space:]]*=|api[_-]?key[[:space:]]*=)' -- . ':(exclude).github/workflows/ci.yml'; then
            echo 'Potential secret pattern found in tracked files.' >&2
            exit 1
          fi
